global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: "lancamentos-api"
    static_configs:
      - targets: ["api-lancamentos:8080"]
    metrics_path: /metrics

  - job_name: "consolidado-api"
    static_configs:
      - targets: ["api-consolidado:8080"]
    metrics_path: /metrics

  - job_name: "event-publisher"
    static_configs:
      - targets: ["event-publisher:8080"]
    metrics_path: /metrics

  - job_name: "projetor"
    static_configs:
      - targets: ["projetor:8080"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
